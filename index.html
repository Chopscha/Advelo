<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advelo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0a0a0a, #111);
    color: white;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px;
    padding: 15px 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.nav-left img {
    width: 45px;
}

.brand {
    font-weight: 700;
}

.nav-links {
    display: flex;
    gap: 30px;
    margin-left: 20px;
}

.nav-links span {
    cursor: pointer;
    color: #d9d9d9;
    opacity: 0.5;
    font-weight: 500;
    transition: 0.2s;
}

.nav-links span:hover {
    opacity: 1;
}

.resources {
    font-weight: 600;
}

.active {
    color: #5271ff !important;
    opacity: 1 !important;
    font-weight: 700 !important;
}

/* HERO */
.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 100px 120px;
}

/* LEFT */
.hero-left h1 {
    font-size: 100px;
    line-height: 1.05;
    margin: 0;
    font-weight: 700;
}

.blue {
    color: #5271ff;
    border-bottom: 6px solid #5271ff;
}

/* RIGHT */
.hero-right {
    max-width: 420px;
}

.title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 15px;
    transition: 0.3s;
}

.description {
    font-size: 18px;
    font-weight: 600;
    color: #ccc;
    margin-bottom: 30px;
}

/* BUTTON */
.cta {
    display: inline-block;
    background: #5271ff;
    padding: 16px 35px;
    border-radius: 15px;
    color: white;
    text-decoration: none;
    font-weight: 600;
    font-size: 18px;
}

/* ANIMATION */
.fade {
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="nav-left">
        <img src="logo.png">
        <div class="brand">@Advelo</div>

        <div class="nav-links">
            <span class="resources">Resources ↓</span>
            <span onclick="changeContent('marketplace', this)">Marketplace</span>
            <span onclick="changeContent('about', this)">About us</span>
            <span onclick="changeContent('servers', this)" class="active">Servers</span>
        </div>
    </div>

    <div class="nav-right">
        <div style="opacity:0.7; font-weight:600;">@username</div>
        <img src="https://via.placeholder.com/40" style="border-radius:50%;">
    </div>
</div>

<!-- HERO -->
<div class="hero">

    <!-- LEFT -->
    <div class="hero-left">
        <h1>
            Advertising<br>
            Done<br>
            <span class="blue">Effortlessly.</span>
        </h1>
    </div>

    <!-- RIGHT -->
    <div class="hero-right fade" id="contentBox">
        <div class="title blue" id="title">Servers</div>

        <div class="description" id="desc">
            We believe in making servers grow with less hassle. We provide utilities and tools to kickstart your server without you worrying.
        </div>

        <a href="#" class="cta">Start your server ⇥</a>
    </div>

</div>

<script>
function changeContent(type, el) {

    // remove active class
    document.querySelectorAll('.nav-links span').forEach(item => {
        item.classList.remove('active');
    });

    el.classList.add('active');

    const title = document.getElementById('title');
    const desc = document.getElementById('desc');
    const box = document.getElementById('contentBox');

    // trigger animation reset
    box.classList.remove('fade');
    void box.offsetWidth;
    box.classList.add('fade');

    if (type === 'marketplace') {
        title.innerText = "Marketplace";
        desc.innerText = "Browse and discover powerful tools and services to boost your server's growth effortlessly.";
    }

    if (type === 'about') {
        title.innerText = "About us";
        desc.innerText = "Learn more about Advelo and how we aim to simplify advertising for communities everywhere.";
    }

    if (type === 'servers') {
        title.innerText = "Servers";
        desc.innerText = "We believe in making servers grow with less hassle. We provide utilities and tools to kickstart your server without you worrying.";
    }
}
</script>

</body>
</html>
